name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract changelog & verify version
        env:
          VERIFY_TAG_VERSION: ${{ github.ref_type == 'tag' }}
        run: node .github/scripts/extract-changelog.mjs "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Build application
        run: pnpm build

      - name: Package macOS installers (arm64 & x64)
        env:
          CSC_IDENTITY_AUTODISCOVERY: 'false'
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish never

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
